[package]
name = "fibonacci-gui"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "blow-your-phase-off-gui"
path = "src/main.rs"

# `cargo test` does not run an example's own tests unless it is told to, and a
# test that only runs when someone remembers to ask for it is not a test. The
# PPM parser has four, covering the shapes a capture can arrive in.
[[example]]
name = "ppm_to_png"
path = "examples/ppm_to_png.rs"
test = true

[dependencies]
fibonacci-dsp = { path = "../fibonacci-dsp", features = ["serde"] }
anyhow = "1"
cpal = "0.15"
midir = "0.10"
rtrb = "0.3"
eframe = "0.29"
# No image decoding: portraits are dithered *text grids* drawn as animated point
# clouds, so the `image` crate and its dependency tree are gone again.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tooling only. `png_to_grid` converts a dithered PNG into a portrait grid; a
# dev-dependency never reaches the shipped binary, so the instrument still decodes
# no images at runtime.
[dev-dependencies]
png = "0.18"
# `font_probe` reads each candidate face's embedded licence metadata and checks it
# actually carries the glyphs this instrument uses. Already in the lock via
# ab_glyph, so it costs no new compilation, and a dev-dependency never ships.
ttf-parser = "0.25"

[build-dependencies]
winresource = "0.1"
