[package]
name = "fibonacci-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blow-your-phase-off-gui"
path = "src/main.rs"

[dependencies]
fibonacci-dsp = { path = "../fibonacci-dsp", features = ["serde"] }
anyhow = "1"
cpal = "0.15"
midir = "0.10"
rtrb = "0.3"
eframe = "0.29"
# PNG only: the portrait plinth loads 1-bit art from the assets. Already in
# the lock file via eframe, so this costs no new compilation.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
