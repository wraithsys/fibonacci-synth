[package]
name = "fibonacci-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blow-your-phase-off-gui"
path = "src/main.rs"

[dependencies]
fibonacci-dsp = { path = "../fibonacci-dsp", features = ["serde"] }
anyhow = "1"
cpal = "0.15"
midir = "0.10"
rtrb = "0.3"
eframe = "0.29"
# No image decoding: portraits are dithered *text grids* drawn as animated point
# clouds, so the `image` crate and its dependency tree are gone again.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tooling only. `png_to_grid` converts a dithered PNG into a portrait grid; a
# dev-dependency never reaches the shipped binary, so the instrument still decodes
# no images at runtime.
[dev-dependencies]
png = "0.18"
